version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: gooseCorp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: AdminDodol
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: gooseCorp_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gooseCorp-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@goosecorp.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_THEME: 'dark'
    ports:
      - '8080:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  pgdata:
  pgadmin_data: 